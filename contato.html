<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101B35">
    <meta name="description" content="Entre em contato com a Kernwerk Labs para conversar sobre software, inteligência artificial e automação.">
    <title>Contato | Kernwerk Labs</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-page { min-height: 100vh; padding: 145px 0 80px; background: var(--kw-white); }
        .contact-card { max-width: 760px; margin: 0 auto; padding: clamp(28px, 6vw, 58px); border: 1px solid var(--kw-line); border-radius: 14px; background: #fff; box-shadow: 0 24px 70px rgba(16,27,53,.07); }
        .contact-card h1 { margin: 18px 0; color: var(--kw-navy); font: 800 clamp(2.2rem, 5vw, 3.5rem)/1.1 var(--font-display); letter-spacing: -.05em; }
        .contact-card > p { color: var(--kw-muted); line-height: 1.8; }
        .contact-option { display: flex; align-items: center; gap: 18px; padding: 20px; border: 1px solid var(--kw-line); border-radius: 9px; color: var(--kw-ink); transition: border-color .2s, transform .2s; }
        .contact-option:hover { transform: translateY(-3px); border-color: var(--kw-light-blue); color: var(--kw-blue); }
        .contact-option i { width: 25px; height: 25px; color: var(--kw-blue); }
        .contact-option strong, .contact-option small { display: block; }
        .contact-option small { margin-top: 4px; color: var(--kw-muted); }
        .back-link { display: inline-block; margin-top: 30px; color: var(--kw-blue); font-weight: 700; }
    </style>
</head>
<body>
<nav class="navbar fixed-top custom-navbar"><div class="container"><a href="index.html" class="brand-lockup"><img src="img/kernwerk-logo.svg" alt="Kernwerk Labs" class="brand-logo"></a><a class="nav-link" href="index.html">Voltar ao site</a></div></nav>
<main class="contact-page">
    <div class="container">
        <section class="contact-card">
            <span class="section-kicker">KERNWERK LABS / CONTATO</span>
            <h1>Vamos conversar sobre sua próxima solução?</h1>
            <p>Conte um pouco sobre seu desafio. Escolha o canal de contato mais conveniente e vamos continuar a conversa.</p>
            <div class="row g-3 mt-4">
                <div class="col-md-6"><a class="contact-option h-100" href="mailto:bluehasecontato@gmail.com"><i data-lucide="mail"></i><span><strong>E-mail</strong><small>bluehasecontato@gmail.com</small></span></a></div>
                <div class="col-md-6"><a class="contact-option h-100" href="https://wa.me/5511949485262" target="_blank" rel="noopener noreferrer"><i data-lucide="message-circle"></i><span><strong>WhatsApp</strong><small>Inicie uma conversa</small></span></a></div>
            </div>
            <a href="index.html" class="back-link">← Voltar para a página inicial</a>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
